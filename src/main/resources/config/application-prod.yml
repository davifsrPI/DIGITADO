# ===================================================================
# Spring Boot configuration for the "prod" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    br.com.digitado: INFO

management:
  prometheus:
    metrics:
      export:
        # MONITORAMENTO: exporta métricas (tempo de resposta, memória, CPU, pool de
        # conexões...) em /management/prometheus para scrape do Prometheus
        enabled: true

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # A URL padrão abaixo serve para TESTE LOCAL (localhost): sem SSL, a flag
    # allowPublicKeyRetrieval é necessária para o caching_sha2_password do MySQL 8
    # e é segura porque a conexão não sai da máquina.
    # SEGURANÇA: com banco REMOTO, defina SPRING_DATASOURCE_URL com
    # useSSL=true&requireSSL=true e SEM allowPublicKeyRetrieval.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/DIGITADO?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false}
    # Usuário DEDICADO com permissões só no schema DIGITADO (nunca root).
    # A SENHA vem exclusivamente de variável de ambiente — NUNCA escreva a senha
    # real neste arquivo: ele vai para o git e o histórico é permanente.
    # Para teste local use o script iniciar-prod.local.ps1 (fora do git).
    username: ${SPRING_DATASOURCE_USERNAME:digitado}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      poolName: Hikari
      auto-commit: false
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: prod
  mail:
    host: localhost
    port: 25
    username:
    password:
  thymeleaf:
    cache: true

# ===================================================================
# To enable TLS in production, generate a certificate using:
# keytool -genkey -alias digitado -storetype PKCS12 -keyalg RSA -keysize 2048 -keystore keystore.p12 -validity 3650
#
# You can also use Let's Encrypt:
# See details in topic "Create a Java Keystore (.JKS) from Let's Encrypt Certificates" on https://maximilian-boehm.com/en-gb/blog
#
# Then, modify the server.ssl properties so your "server" configuration looks like:
#
# server:
#   port: 443
#   ssl:
#     key-store: classpath:config/tls/keystore.p12
#     key-store-password: password
#     key-store-type: PKCS12
#     key-alias: selfsigned
#     # The ciphers suite enforce the security by deactivating some old and deprecated SSL cipher, this list was tested against SSL Labs (https://www.ssllabs.com/ssltest/)
#     ciphers: TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_DHE_RSA_WITH_AES_128_GCM_SHA256 ,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384,TLS_DHE_RSA_WITH_AES_128_CBC_SHA256,TLS_DHE_RSA_WITH_AES_128_CBC_SHA,TLS_DHE_RSA_WITH_AES_256_CBC_SHA256,TLS_DHE_RSA_WITH_AES_256_CBC_SHA,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_128_CBC_SHA256,TLS_RSA_WITH_AES_256_CBC_SHA256,TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_AES_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_128_CBC_SHA,TLS_RSA_WITH_CAMELLIA_128_CBC_SHA
# ===================================================================
server:
  port: 8080
  shutdown: graceful # see https://docs.spring.io/spring-boot/docs/current/reference/html/spring-boot-features.html#boot-features-graceful-shutdown
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024
  # ATRÁS DO PROXY REVERSO (Caddy/nginx na mesma máquina — ver deploy/Caddyfile):
  # o Tomcat passa a ler X-Forwarded-For/Proto enviados pelo proxy. Com isso,
  # getRemoteAddr() devolve o IP REAL do aluno (o rate limit depende disso) e
  # request.isSecure() reflete o HTTPS externo.
  # SEGURO por padrão: o Tomcat só aceita esses cabeçalhos quando a conexão vem
  # de um IP interno (127.0.0.1, redes privadas) — quem acessar o :8080 direto
  # da internet não consegue forjá-los. Mantenha o confiar-x-forwarded-for do
  # rate limit em false: com o remoteip valve ele deixa de ser necessário.
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  http:
    cache: # Used by the CachingHttpHeadersFilter
      timeToLiveInDays: 1461
  security:
    authentication:
      jwt:
        # SEGURANÇA: SEM fallback de propósito — em produção a aplicação NÃO SOBE
        # sem a variável de ambiente JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET
        # (fail-fast é melhor do que rodar com a chave pública padrão do JHipster).
        # Gere a sua: openssl rand -base64 64
        base64-secret: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET:}
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  mail: # specific JHipster mail property, for standard properties see MailProperties
    base-url: http://my-server-url-to-change # Modify according to your server's URL
  logging:
    # MONITORAMENTO: em produção os logs saem estruturados em JSON (um objeto por linha,
    # com timestamp, nível, logger, mensagem, stack trace e campos do MDC como o requestId),
    # prontos para ingestão por Loki/ELK/CloudWatch
    use-json-format: true
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
