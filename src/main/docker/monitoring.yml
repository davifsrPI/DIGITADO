# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
#
# Prometheus + Alertmanager + Grafana para o DIGITADO.
#
# Rede bridge com host.docker.internal, e não network_mode: host. No Docker Desktop
# (Windows/macOS) o modo host liga os containers à máquina virtual do Docker, e não
# ao Windows: o Prometheus não achava o DIGITADO em localhost:8080 e nem o Grafana
# nem o Prometheus abriam no navegador - o painel ficava vazio sem erro nenhum.
#
# host.docker.internal é a máquina onde o DIGITADO roda. No Docker Desktop o pedido
# chega ao DIGITADO como se viesse da própria máquina (127.0.0.1), que é o que libera
# /management/prometheus sem login. No Linux o extra_hosts abaixo cria o mesmo nome,
# mas o pedido chega pela rede do Docker: configure o token de métricas (ver
# prometheus.yml e MONITORING.md).
name: digitado
services:
  prometheus:
    image: prom/prometheus:v3.3.1
    volumes:
      - ./prometheus/:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 127.0.0.1:9090:9090
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./alertmanager/:/etc/alertmanager/
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 127.0.0.1:9093:9093
  grafana:
    image: grafana/grafana:12.0.0
    volumes:
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - prometheus
