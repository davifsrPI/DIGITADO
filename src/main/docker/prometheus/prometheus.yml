# Sample global config for monitoring JHipster applications
global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.
  evaluation_interval: 15s # By default, scrape targets every 15 seconds.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: 'jhipster'

# Regras de alerta para anomalias (erros 5xx, latência, heap, CPU, pool de conexões)
rule_files:
  - alert-rules.yml

# Envia os alertas disparados para o Alertmanager (ver monitoring.yml)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # Nome do serviço no monitoring.yml (rede do compose)
            - alertmanager:9093

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s

    # scheme defaults to 'http' enable https in case your application is server via https
    #scheme: https
    # basic auth is not needed by default. See https://www.jhipster.tech/monitoring/#configuring-metrics-forwarding for details
    #basic_auth:
    # username: admin
    # password: admin
    metrics_path: /management/prometheus
    # Sem JWT: o DIGITADO libera as métricas para a própria máquina (127.0.0.1) e,
    # quando configurado, para quem mandar o token de métricas. Para usar o token
    # (DIGITADO em container, Prometheus no Linux ou noutro servidor), grave o mesmo
    # valor de APPLICATION_MONITORAMENTO_TOKEN_METRICAS no arquivo
    # src/main/docker/prometheus/token-metricas (fora do git) e descomente:
    # http_headers:
    #   X-Token-Metricas:
    #     files: ['/etc/prometheus/token-metricas']
    static_configs:
      - targets:
          # A máquina onde o DIGITADO roda, vista de dentro do container
          # (ver monitoring.yml). Para Prometheus instalado direto na máquina, use localhost:8080
          - host.docker.internal:8080
